  /records/{id}/attachments/{attachmentId}:
    get: { tags: [Records], operationId: getRecordAttachment, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/AttachmentId' }], responses: { '200': { description: Attachment bytes }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /records/{id}/ai/classify:
    post: { tags: [AI], operationId: classifyRecord, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '202': { $ref: '#/components/responses/JsonSuccess' } } }
  /records/{id}/review:
