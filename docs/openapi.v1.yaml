openapi: 3.1.0
info:
  title: CNPAF Collect API
  version: 1.1.0-v4.1
  description: Permission- and scope-aware API for CNPAF Collect. Exported Zod schemas in @cnpaf/shared are the canonical TypeScript request contracts.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Session
  - name: Access
  - name: Configuration
  - name: Records
  - name: AI
  - name: Reports
  - name: Ask Collect
  - name: Exports
  - name: Programs
  - name: Tasks
  - name: Datasets
  - name: Notifications
paths:
  /health:
    get: { tags: [Session], operationId: health, security: [], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /auth/login:
    post: { tags: [Session], operationId: login, security: [], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /auth/logout:
    post: { tags: [Session], operationId: logout, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /auth/me:
    get: { tags: [Session], operationId: getLegacyAuthMe, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /auth/password:
    post: { tags: [Session], operationId: changePassword, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /account:
    get: { tags: [Session], operationId: getAccount, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    delete: { tags: [Session], operationId: deleteAccount, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /account/avatar:
    get: { tags: [Session], operationId: getAccountAvatar, responses: { '200': { description: Avatar image }, '404': { $ref: '#/components/responses/NotFound' } } }
    post: { tags: [Session], operationId: uploadAccountAvatar, requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [avatar], properties: { avatar: { type: string, format: binary } } } } } }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /me:
    get: { tags: [Session], operationId: getMe, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /me/capabilities:
    get: { tags: [Session], operationId: getCapabilities, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /lookups:
    get: { tags: [Configuration], operationId: getLegacyLookups, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /invites:
    get: { tags: [Access], operationId: listLegacyInvites, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Access], operationId: createLegacyInvite, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    put: { tags: [Access], operationId: acceptLegacyInvite, security: [], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /users:
    get: { tags: [Access], operationId: listUsers, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /users/invite:
    post: { tags: [Access], operationId: inviteUser, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /users/{id}:
    get: { tags: [Access], operationId: getUser, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /users/{id}/status:
    patch: { tags: [Access], operationId: updateUserStatus, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /users/{id}/role-assignments:
    post: { tags: [Access], operationId: createRoleAssignment, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /users/{id}/permission-scopes:
    post: { tags: [Access], operationId: createPermissionScope, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /permission-scopes/{id}:
    patch: { tags: [Access], operationId: updatePermissionScope, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    delete: { tags: [Access], operationId: deletePermissionScope, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Deleted } } }
  /roles:
    get: { tags: [Access], operationId: listRoles, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/users:
    get: { tags: [Access], operationId: adminListUsers, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Access], operationId: adminCreateUser, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /admin/users/{userId}:
    get: { tags: [Access], operationId: adminGetUser, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    patch: { tags: [Access], operationId: adminUpdateUser, parameters: [{ $ref: '#/components/parameters/UserId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/users/{userId}/access:
    get: { tags: [Access], operationId: getUserAccess, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    put: { tags: [Access], operationId: replaceUserAccess, parameters: [{ $ref: '#/components/parameters/UserId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /admin/users/{userId}/roles:
    get: { tags: [Access], operationId: getUserRoles, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    put: { tags: [Access], operationId: replaceUserRoles, parameters: [{ $ref: '#/components/parameters/UserId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/users/{userId}/deactivate:
    post: { tags: [Access], operationId: deactivateUser, parameters: [{ $ref: '#/components/parameters/UserId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/users/{userId}/reactivate:
    post: { tags: [Access], operationId: reactivateUser, parameters: [{ $ref: '#/components/parameters/UserId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/users/{userId}/reset-password:
    post: { tags: [Access], operationId: resetUserPassword, parameters: [{ $ref: '#/components/parameters/UserId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/users/{userId}/affiliations:
    post: { tags: [Access], operationId: addUserAffiliation, parameters: [{ $ref: '#/components/parameters/UserId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/users/{userId}/affiliations/{affiliationId}:
    delete: { tags: [Access], operationId: removeUserAffiliation, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/AffiliationId' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/roles:
    get: { tags: [Access], operationId: adminListRoles, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Access], operationId: createRole, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/roles/{roleId}:
    patch: { tags: [Access], operationId: updateRole, parameters: [{ $ref: '#/components/parameters/RoleId' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/permissions:
    get: { tags: [Access], operationId: listPermissions, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /admin/audit-events:
    get: { tags: [Access], operationId: listAuditEvents, parameters: [{ name: before, in: query, description: Opaque cursor returned as nextBefore; ISO date-time is accepted for legacy clients., schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /people-groups:
    get: { tags: [Access], operationId: listPeopleGroups, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Access], operationId: createPeopleGroup, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /people-groups/{id}:
    patch: { tags: [Access], operationId: updatePeopleGroup, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /config/registries/{registryKey}:
    get: { tags: [Configuration], operationId: getRegistry, parameters: [{ $ref: '#/components/parameters/RegistryKey' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /config/registries/{registryKey}/items:
    post: { tags: [Configuration], operationId: createRegistryItem, parameters: [{ $ref: '#/components/parameters/RegistryKey' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /config/registries/{registryKey}/items/{id}:
    patch: { tags: [Configuration], operationId: updateRegistryItem, parameters: [{ $ref: '#/components/parameters/RegistryKey' }, { $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /config/registries/{registryKey}/items/{id}/archive:
    post: { tags: [Configuration], operationId: archiveRegistryItem, parameters: [{ $ref: '#/components/parameters/RegistryKey' }, { $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /templates:
    get: { tags: [Configuration], operationId: listTemplates, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Configuration], operationId: createTemplate, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /templates/{id}:
    get: { tags: [Configuration], operationId: getTemplate, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    delete: { tags: [Configuration], operationId: archiveTemplate, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /templates/{id}/versions:
    post: { tags: [Configuration], operationId: createTemplateVersion, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /templates/{id}/duplicate:
    post: { tags: [Configuration], operationId: duplicateTemplate, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /templates/{id}/unpublish:
    post: { tags: [Configuration], operationId: unpublishTemplate, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /templates/{id}/versions/compare:
    get: { tags: [Configuration], operationId: compareTemplateVersions, parameters: [{ $ref: '#/components/parameters/Id' }, { name: fromVersionId, in: query, required: true, schema: { type: string, format: uuid } }, { name: toVersionId, in: query, required: true, schema: { type: string, format: uuid } }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-versions/{id}:
    get: { tags: [Configuration], operationId: getTemplateVersion, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    patch: { tags: [Configuration], operationId: updateTemplateVersion, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /template-versions/{id}/publish:
    post: { tags: [Configuration], operationId: publishTemplateVersion, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-versions/{id}/sections:
    post: { tags: [Configuration], operationId: createTemplateSection, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-versions/{id}/sections/reorder:
    post: { tags: [Configuration], operationId: reorderTemplateSections, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-sections/{id}:
    patch: { tags: [Configuration], operationId: updateTemplateSection, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    delete: { tags: [Configuration], operationId: deleteTemplateSection, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-sections/{id}/duplicate:
    post: { tags: [Configuration], operationId: duplicateTemplateSection, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-sections/{id}/fields:
    post: { tags: [Configuration], operationId: createTemplateField, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-sections/{id}/fields/reorder:
    post: { tags: [Configuration], operationId: reorderTemplateFields, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-fields/{id}:
    patch: { tags: [Configuration], operationId: updateTemplateField, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    delete: { tags: [Configuration], operationId: deleteTemplateField, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-fields/{id}/duplicate:
    post: { tags: [Configuration], operationId: duplicateTemplateField, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-fields/{id}/options:
    post: { tags: [Configuration], operationId: createTemplateFieldOption, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-fields/{id}/options/reorder:
    post: { tags: [Configuration], operationId: reorderTemplateFieldOptions, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-field-options/{id}:
    patch: { tags: [Configuration], operationId: updateTemplateFieldOption, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /template-field-options/{id}/archive:
    post: { tags: [Configuration], operationId: archiveTemplateFieldOption, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /quick-capture/forms:
    get: { tags: [Records], operationId: listQuickCaptureForms, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /quick-capture/forms/{versionId}/package:
    get: { tags: [Records], operationId: getQuickCapturePackage, parameters: [{ $ref: '#/components/parameters/VersionId' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /records:
    get: { tags: [Records], operationId: listRecords, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Records], operationId: upsertDraft, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    put: { tags: [Records], operationId: submitRecord, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /records/options:
    get: { tags: [Records], operationId: getRecordFilterOptions, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /records/{id}:
    get: { tags: [Records], operationId: getRecord, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /records/{id}/attachments:
    post: { tags: [Records], operationId: createRecordAttachment, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /records/{id}/attachments/{attachmentId}:
    get: { tags: [Records], operationId: getRecordAttachment, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/AttachmentId' }], responses: { '200': { description: Attachment bytes }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /records/{id}/ai/classify:
    post: { tags: [AI], operationId: classifyRecord, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '202': { $ref: '#/components/responses/JsonSuccess' } } }
  /records/{id}/review:
    post: { tags: [Records], operationId: legacyReviewRecord, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /records/{id}/review-decisions:
    post: { tags: [Records], operationId: reviewRecord, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /review-queue:
    get: { tags: [Records], operationId: getReviewQueue, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /privacy-queue:
    get: { tags: [Records], operationId: getPrivacyQueue, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /privacy-flags/{id}/resolve:
    post: { tags: [Records], operationId: resolvePrivacyFlag, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /safety-queue:
    get: { tags: [Records], operationId: getSafetyQueue, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /safety-flags/{id}/resolve:
    post: { tags: [Records], operationId: resolveSafetyFlag, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /safety:
    get: { tags: [Records], operationId: getLegacySafetyFlags, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    patch: { tags: [Records], operationId: resolveLegacySafetyFlag, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /custom-entries:
    get: { tags: [Configuration], operationId: listCustomEntries, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /custom-entries/{id}/map-existing:
    post: { tags: [Configuration], operationId: mapCustomEntryExisting, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /custom-entries/{id}/create-option:
    post: { tags: [Configuration], operationId: createOptionFromCustomEntry, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /custom-entries/{id}/keep-free-text:
    post: { tags: [Configuration], operationId: keepCustomEntryFreeText, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /custom-entries/{id}/dismiss:
    post: { tags: [Configuration], operationId: dismissCustomEntry, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /sites:
    get: { tags: [Configuration], operationId: listSites, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Configuration], operationId: createSite, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    patch: { tags: [Configuration], operationId: mergeSite, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /ai/runs:
    get: { tags: [AI], operationId: listAiRuns, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /ai/runs/{id}:
    get: { tags: [AI], operationId: getAiRun, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /ai/runs/{id}/findings:
    get: { tags: [AI], operationId: listAiRunFindings, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /ai/runs/{id}/reclassify:
    post: { tags: [AI], operationId: reclassify, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '202': { $ref: '#/components/responses/JsonSuccess' } } }
  /ai/runs/{id}/retry:
    post: { tags: [AI], operationId: retryAiRun, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '202': { $ref: '#/components/responses/JsonSuccess' } } }
  /ai/findings/{id}/review:
