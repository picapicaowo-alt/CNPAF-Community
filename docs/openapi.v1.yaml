  /records/{id}/review-decisions:
    post: { tags: [Records], operationId: reviewRecord, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /review-queue:
    get: { tags: [Records], operationId: getReviewQueue, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /privacy-queue:
    get: { tags: [Records], operationId: getPrivacyQueue, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /privacy-flags/{id}/resolve:
