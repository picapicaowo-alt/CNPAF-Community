  /ask-collect/conversations/{id}:
    get: { tags: [Ask Collect], operationId: getAskConversation, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /ask-collect/conversations/{id}/messages:
    post: { tags: [Ask Collect], operationId: createAskMessage, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '201': { $ref: '#/components/responses/JsonSuccess' } } }
  /export-jobs:
    get: { tags: [Exports], operationId: listExportJobs, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Exports], operationId: createExportJob, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '202': { $ref: '#/components/responses/JsonSuccess' } } }
  /export-jobs/{id}:
    get: { tags: [Exports], operationId: getExportJob, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /export-jobs/{id}/download:
    get: { tags: [Exports], operationId: downloadExport, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Generated JSON or CSV file, content: { application/json: { schema: {} }, text/csv: { schema: { type: string } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /jobs:
    get: { tags: [Configuration], operationId: listInternalJobs, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    post: { tags: [Configuration], operationId: processInternalJobs, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
    patch: { tags: [Configuration], operationId: retryInternalJob, requestBody: { $ref: '#/components/requestBodies/JsonBody' }, responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: cnpaf_session }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    RegistryKey: { name: registryKey, in: path, required: true, schema: { type: string } }
  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        authorization: { type: string }
  responses:
    JsonSuccess:
      description: Successful JSON response; see the named Zod contract and backend API contract document.
      content: { application/json: { schema: { type: object, additionalProperties: true } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Effective permission or scope denied
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found or hidden by access policy
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Immutable version or invalid state transition
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
