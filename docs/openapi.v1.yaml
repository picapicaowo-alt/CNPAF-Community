  /template-field-options/{id}/archive:
    post: { tags: [Configuration], operationId: archiveTemplateFieldOption, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/JsonSuccess' } } }
  /records:
