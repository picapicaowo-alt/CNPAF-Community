services:
  postgres:
    image: postgres:16-alpine
    container_name: cnpaf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CNPAF_DB_USER:-cnpaf}
      POSTGRES_PASSWORD: ${CNPAF_DB_PASSWORD:?Set CNPAF_DB_PASSWORD in .env}
      POSTGRES_DB: ${CNPAF_DB_NAME:-cnpaf}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - cnpaf

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnpaf-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${CNPAF_DB_USER:-cnpaf}:${CNPAF_DB_PASSWORD:?Set CNPAF_DB_PASSWORD in .env}@postgres:5432/${CNPAF_DB_NAME:-cnpaf}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_DEMO_USERS_JSON: ${SEED_DEMO_USERS_JSON:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_DIR: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      S3_PREFIX: ${S3_PREFIX:-cnpaf}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    networks:
      - cnpaf
    profiles:
      - app

volumes:
  postgres-data:
  uploads:

networks:
  cnpaf:
    name: cnpaf
